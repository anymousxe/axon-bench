[project]
name = "axon-bench"
version = "1.1.1"
description = "AXE — the Axon Labs evaluation suite. Open benchmark with independent AXE and AXE-Pro tracks for general knowledge, coding, and reasoning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Axon Labs" }]
keywords = ["benchmark", "llm", "evaluation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://axon-chat-nu.vercel.app/benchmarks"

[project.scripts]
axon-bench = "axon_bench.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["axon_bench*"]
